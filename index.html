<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLD Engineer Pro v9.5 - UI Optimized</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --bg: #0b0b0b; --panel: #1e1e1e; --accent: #4a90e2; --on: #ff0000; --off: #00ff00; --box: #3b5b91; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        /* Header */
        .header { height: 50px; background: var(--panel); display: flex; align-items: center; padding: 0 15px; border-bottom: 1px solid #333; justify-content: space-between; z-index: 1001; position: relative; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .project-title { position: absolute; left: 50%; transform: translateX(-50%); color: #edca1a; font-weight: bold; font-size: 14px; text-transform: uppercase; pointer-events: none; white-space: nowrap; }
        .top-btns { display: flex; gap: 8px; align-items: center; }
        
        button { background: #333; color: white; border: 1px solid #555; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 11px; font-weight: bold; transition: 0.2s; }
        button:hover { background: var(--accent); }

        .main { display: flex; height: calc(100% - 50px); position: relative; }
        
        /* Sidebar Toggle Logic */
        .sidebar { width: 200px; background: var(--panel); border-right: 1px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; z-index: 1000; transition: all 0.3s ease; }
        .sidebar.collapsed { width: 0; padding: 0; border: none; margin-left: -1px; overflow: hidden; }

        .tool-item { background: #2d2d2d; border: 1px solid #444; padding: 12px; border-radius: 6px; cursor: grab; text-align: center; font-size: 11px; user-select: none; min-width: 170px; }

        /* Workspace */
        .workspace { flex: 1; position: relative; overflow: auto; background-image: radial-gradient(#222 1px, transparent 1px); background-size: 20px 20px; }
        #canvas-container { transform-origin: 0 0; width: 4000px; height: 3000px; position: relative; }
        #canvas { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        /* Objects */
        .obj-wrap { position: absolute; cursor: move; z-index: 10; touch-action: none; }
        .delete-btn { position: absolute; top: -20px; left: -10px; color: white; background: #ff4444; cursor: pointer; font-weight: bold; border-radius: 50%; width: 22px; height: 22px; text-align: center; line-height: 20px; border: 2px solid #fff; display: none; z-index: 100; }
        .obj-wrap:hover .delete-btn { display: block; }

        /* Symbols */
        .mc-container { position: relative; margin-top: 30px; margin-left: 10px; }
        .mc-box { width: 50px; height: 90px; border: 2px solid var(--box); background: #000; position: relative; pointer-events: none; }
        .line-v { position: absolute; width: 2px; left: 24px; }
        .mc-arm { position: absolute; width: 2px; left: 24px; top: 25px; height: 35px; transform-origin: bottom center; transition: 0.3s; }
        .pivot { position: absolute; width: 6px; height: 6px; border: 1px solid #fff; border-radius: 50%; left: -3px; background: inherit; }
        .mc-label { position: absolute; left: 65px; top: -30px; background: transparent; border: 1px dashed #555; color: #edca1a; font-weight: bold; font-size: 13px; width: 120px; outline: none; padding: 2px; }
        .mc-ui-right { position: absolute; left: 65px; top: 30px; display: flex; flex-direction: column; gap: 4px; }
        .btn-ctrl { padding: 4px 8px; font-size: 10px; border: none; border-radius: 3px; cursor: pointer; color: white; min-width: 60px; font-weight: bold; }
        .btn-on { background: #b30000; } .btn-off { background: #006400; }
        
        .symbol-box { border: 2px solid var(--box); position: relative; background: rgba(255,255,255,0.05); border-radius: 4px; }
        .rmu-ctrl-box { position: absolute; display: flex; flex-direction: column; gap: 2px; z-index: 100; width: 44px; align-items: center; }
        .btn-s { padding: 2px; font-size: 9px; color: white; border: none; border-radius: 2px; cursor: pointer; min-width: 40px; border: 1px solid #000; font-weight: bold; }

        /* Wires */
        svg.conn-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .wire-path { stroke: var(--off); stroke-width: 5; fill: none; pointer-events: stroke; cursor: ns-resize; transition: stroke 0.2s; }
        .wire-path.powered { stroke: var(--on) !important; }

        /* Port & Busbar */
        .port { width: 14px; height: 14px; background: #edca1a; border-radius: 50%; position: absolute; cursor: crosshair; z-index: 50; border: 2px solid #000; transform: translate(-50%, -50%); }
        .busbar-container { position: relative; padding-top: 40px; pointer-events: none; }
        .busbar-line { height: 12px; background: var(--off); border-radius: 6px; cursor: crosshair; min-width: 50px; pointer-events: auto; }
        .bus-handle { width: 8px; height: 20px; background: #fff; position: absolute; right: -4px; top: 36px; cursor: ew-resize; z-index: 20; border-radius: 2px; pointer-events: auto; border: 1px solid #000; }

        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: #1a1a1a; border: 1px solid #444; width: 450px; border-radius: 12px; padding: 25px; display: flex; flex-direction: column; }
        .project-list { overflow-y: auto; flex: 1; min-height: 250px; margin-top: 10px; border: 1px solid #333; background: #000; border-radius: 6px; }
        .project-item { padding: 12px; background: #2a2a2a; margin: 5px; border-radius: 4px; cursor: pointer; border: 1px solid transparent; }
        .project-item.selected { background: #1e3a5f; border-color: var(--accent); }
    </style>
</head>
<body onmouseup="stopDragging()">

<div class="header">
    <div class="header-left">
        <button onclick="toggleSidebar()" style="background:#4a90e2; font-size:16px; padding: 6px 15px;">☰ MENU</button>
        <button onclick="undo()">↩ Undo</button>
    </div>
    <div class="project-title" id="displayProjectName">DỰ ÁN TRỐNG</div>
    <div class="top-btns">
        <div style="font-size:10px; display:flex; align-items:center; gap:3px; background:#222; padding:3px 10px; border-radius:6px; margin-right:10px">
            Zoom: <button onclick="changeZoom(0.1)">+</button><button onclick="changeZoom(-0.1)">-</button>
        </div>
        <button onclick="handleNew()" style="background:#007bff">TẠO MỚI</button>
        <button onclick="handleSave()" style="background:#28a745">SAVE</button>
        <button onclick="openOpenModal()" style="background:#ffc107; color:black">MỞ</button>
    </div>
</div>

<div id="openModal" class="modal">
    <div class="modal-content">
        <div style="font-weight:bold; color:#edca1a; margin-bottom:15px; display:flex; justify-content:space-between">
            <span>DANH SÁCH DỰ ÁN</span> <span style="cursor:pointer" onclick="closeModal('openModal')">✖</span>
        </div>
        <div id="openList" class="project-list"></div>
        <div style="margin-top:15px; display:flex; gap:10px">
            <button onclick="confirmOpen()" style="flex:1; background:#ffc107; color:black">MỞ DỰ ÁN</button>
            <button onclick="closeModal('openModal')" style="flex:1">HỦY</button>
        </div>
    </div>
</div>

<div id="saveModal" class="modal">
    <div class="modal-content">
        <div style="font-weight:bold; color:#28a745; margin-bottom:15px; display:flex; justify-content:space-between">
            <span>LƯU DỰ ÁN</span> <span style="cursor:pointer" onclick="closeModal('saveModal')">✖</span>
        </div>
        <input type="text" id="saveInput" style="width:100%; background:#000; border:1px solid #444; color:#fff; padding:10px; margin-bottom:10px; box-sizing: border-box;" placeholder="Tên dự án...">
        <div id="saveList" class="project-list"></div>
        <div style="margin-top:15px; display:flex; gap:10px">
            <button onclick="confirmSaveAs()" style="flex:1; background:#28a745">XÁC NHẬN LƯU</button>
            <button onclick="closeModal('saveModal')" style="flex:1">ĐÓNG</button>
        </div>
    </div>
</div>

<div class="main">
    <div class="sidebar" id="sidebar">
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'mc_tong')">Máy Cắt Tổng</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'mc_feeder')">Máy Cắt Nhánh</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'mba')">Máy Biến Áp</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'busbar')">Thanh Cái</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'text_box')" style="color:#edca1a">Ô Ghi Chú</div>
        <div style="color:#888; font-size:10px; text-align:center; margin-top:10px">HỆ RMU</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'rmu2')">RMU 2 Ngăn</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'rmu3')">RMU 3 Ngăn</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'rmu4')">RMU 4 Ngăn</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'rmu5')">RMU 5 Ngăn</div>
    </div>
    <div class="workspace" ondragover="event.preventDefault()" ondrop="evDrop(event)">
        <div id="canvas-container">
            <div id="canvas">
                <svg id="conn-layer" class="conn-layer">
                    <path id="ghost-path" style="stroke:#fff; stroke-width:2; stroke-dasharray:5; fill:none; display:none"></path>
                </svg>
            </div>
        </div>
    </div>
</div>

<script>
    // --- FIREBASE CONFIG (Giữ nguyên của bạn) ---
    const firebaseConfig = {
        apiKey: "AIzaSyC9aGNmyKDkHvqQg0CY9SfrmNrMhFQGSzo",
        authDomain: "my-sld-project.firebaseapp.com",
        databaseURL: "https://my-sld-project-default-rtdb.firebaseio.com",
        projectId: "my-sld-project",
        storageBucket: "my-sld-project.firebasestorage.app",
        messagingSenderId: "931677457263",
        appId: "1:931677457263:web:6bd129cd12e53a5f71369a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let data = { nodes: [], wires: [] };
    let history = [];
    let selectedPort = null;
    let draggingWireIdx = null;
    let currentZoom = 1.0;
    let selectedProjectName = "";
    let nameInList = "";

    const canvas = document.getElementById('canvas');
    const canvasContainer = document.getElementById('canvas-container');
    const connLayer = document.getElementById('conn-layer');
    const ghostPath = document.getElementById('ghost-path');

    // --- UI Toggles ---
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('collapsed');
    }

    // --- FILE MGMT ---
    function handleNew() { if(data.nodes.length > 0 && confirm("Lưu trước khi tạo mới?")) openSaveModal(() => resetB()); else resetB(); }
    function resetB() { let n = prompt("Tên dự án mới:"); if(!n) return; data={nodes:[],wires:[]}; selectedProjectName=n; document.getElementById('displayProjectName').innerText=n.toUpperCase(); render(); pushHistory(); }
    function handleSave() { if(!selectedProjectName) openSaveModal(); else db.ref('projects/'+selectedProjectName).set(data).then(()=>alert("Đã lưu!")); }
    function openOpenModal() { document.getElementById('openModal').style.display='flex'; fetchP('openList', (n)=>nameInList=n); }
    function confirmOpen() { if(!nameInList) return; db.ref('projects/'+nameInList).once('value', s => { data=s.val()||{nodes:[],wires:[]}; if(!data.wires) data.wires=[]; selectedProjectName=nameInList; document.getElementById('displayProjectName').innerText=selectedProjectName.toUpperCase(); render(); pushHistory(); closeModal('openModal'); }); }
    function openSaveModal(cb) { document.getElementById('saveModal').style.display='flex'; fetchP('saveList', (n)=>document.getElementById('saveInput').value=n); window.sCb=cb; }
    function confirmSaveAs() { let n = document.getElementById('saveInput').value.trim(); if(!n) return; db.ref('projects/'+n).set(data).then(()=>{ selectedProjectName=n; document.getElementById('displayProjectName').innerText=n.toUpperCase(); closeModal('saveModal'); if(window.sCb) window.sCb(); }); }
    function fetchP(cid, onS) { const div=document.getElementById(cid); div.innerHTML="..."; db.ref('projects').once('value', s => { div.innerHTML=""; if(s.exists()) s.forEach(c => { const i=document.createElement('div'); i.className='project-item'; i.innerText="📁 "+c.key; i.onclick=()=>{ Array.from(div.children).forEach(e=>e.classList.remove('selected')); i.classList.add('selected'); onS(c.key); }; div.appendChild(i); }); }); }
    function closeModal(id) { document.getElementById(id).style.display='none'; }

    // --- CORE LOGIC (SNAP REMOVED) ---
    function snap(v) { return v; } // Chức năng Snap bị loại bỏ, trả về giá trị thực
    function changeZoom(d) { currentZoom = Math.min(Math.max(0.3, currentZoom+d), 2.5); canvasContainer.style.transform=`scale(${currentZoom})`; }
    function pushHistory() { const s=JSON.stringify(data); if(!history.length || history[history.length-1]!==s) { history.push(s); if(history.length>50) history.shift(); } }
    function undo() { if(history.length > 1){ history.pop(); data=JSON.parse(history[history.length-1]); render(); } }

    function solvePower() {
        data.nodes.forEach(n => n.powered = false);
        data.nodes.forEach(n => { if(n.type === 'mc_tong' && n.state && !data.wires.some(w => w.to === n.id && w.toPort === 'top')) n.powered = true; });
        for(let i=0; i<40; i++) {
            data.wires.forEach(w => {
                const n1=data.nodes.find(n=>n.id===w.from), n2=data.nodes.find(n=>n.id===w.to);
                if(!n1 || !n2) return;
                if(n1.powered && isPortActive(n1, w.fromPort) && isPortActive(n2, w.toPort)) n2.powered = true;
                if(n2.powered && isPortActive(n2, w.toPort) && isPortActive(n1, w.fromPort)) n1.powered = true;
            });
        }
    }

    function isPortActive(n, p) {
        if(n.type.startsWith('mc')) return n.state;
        if(n.type.startsWith('rmu')) return p.startsWith('bay') ? n.states[parseInt(p.split('_')[1])] : true;
        return true;
    }

    function getPortPower(nid, p) {
        const w = data.wires.find(w => (w.from===nid && w.fromPort===p) || (w.to===nid && w.toPort===p));
        if(!w) return false;
        const oid = (w.from===nid)?w.to:w.from, op = (w.from===nid)?w.toPort:w.fromPort, on = data.nodes.find(n=>n.id===oid);
        return on ? (on.powered && isPortActive(on, op)) : false;
    }

    // --- RENDER ---
    function render() {
        Array.from(canvas.children).forEach(c => { if(c.id!=='conn-layer') c.remove(); });
        solvePower();
        data.nodes.forEach(node => {
            const wrap = document.createElement('div'); wrap.className='obj-wrap';
            wrap.style.left=node.x+'px'; wrap.style.top=node.y+'px';
            let html='';
            if(node.type==='text_box') {
                html=`<div style="border:1px dashed #edca1a; width:${node.width}px; height:${node.height}px; background:rgba(237,202,26,0.05)">
                    <textarea style="width:100%; height:100%; background:transparent; border:none; color:white; text-align:center; outline:none" onchange="updateLabel('${node.id}', this.value)">${node.label}</textarea></div>`;
            } else if(node.type.startsWith('mc')) {
                const p=node.powered, s=node.state;
                html=`<div class="mc-container"><input class="mc-label" value="${node.label}" onchange="updateLabel('${node.id}', this.value)">
                    <div class="mc-box">
                        <div class="line-v" style="height:56px; top:-31px; background:${p?'var(--on)':'white'}"></div>
                        <div class="mc-arm" style="transform:rotate(${s?0:35}deg); background:${s?(p?'var(--on)':'white'):'var(--off)'}"><div class="pivot" style="top:-3px; background:inherit"></div><div class="pivot" style="bottom:-3px; background:inherit"></div></div>
                        <div class="line-v" style="height:65px; top:60px; background:${(p && s)?'var(--on)':'var(--off)'}"></div>
                    </div>
                    <div class="mc-ui-right"><button class="btn-ctrl btn-on" onclick="controlMC('${node.id}', true)">ĐÓNG</button><button class="btn-ctrl btn-off" onclick="controlMC('${node.id}', false)">CẮT</button></div></div>`;
            } else if(node.type === 'mba') {
                html=`<div style="margin-top:30px; position:relative; margin-left:10px"><input class="mc-label" value="${node.label}" onchange="updateLabel('${node.id}', this.value)">
                    <div class="line-v" style="left:29px; height:30px; top:-30px; background:${node.powered?'var(--on)':'white'}"></div>
                    <svg width="60" height="60"><circle cx="30" cy="20" r="18" stroke="${node.powered?'var(--on)':'var(--box)'}" stroke-width="2" fill="none"/><circle cx="30" cy="40" r="18" stroke="${node.powered?'var(--on)':'var(--box)'}" stroke-width="2" fill="none"/></svg>
                    <div class="line-v" style="left:29px; height:40px; top:60px; background:${node.powered?'var(--on)':'var(--off)'}"></div></div>`;
            } else if(node.type === 'busbar') {
                html=`<div class="busbar-container"><input class="mc-label" style="top:15px; left:0" value="${node.label}" onchange="updateLabel('${node.id}', this.value)">
                    <div class="busbar-line" style="width:${node.width}px; background:${node.powered?'var(--on)':'var(--off)'}" onclick="onBusClick('${node.id}', event)"></div>
                    <div class="bus-handle" onmousedown="startResizeBus(event, '${node.id}')"></div></div>`;
            } else if(node.type.startsWith('rmu')) { html = getRMUHtml(node); }

            wrap.innerHTML=html;
            const del=document.createElement('div'); del.className='delete-btn'; del.innerHTML='×';
            del.onclick=(e)=>{e.stopPropagation(); deleteNode(node.id);}; wrap.appendChild(del);

            if(node.type.startsWith('mc')) { createPort(wrap, node, 35, 0, 'top'); createPort(wrap, node, 35, 155, 'bottom'); }
            else if(node.type==='mba') { createPort(wrap, node, 40, 0, 'top'); createPort(wrap, node, 40, 130, 'bottom'); }
            else if(node.type.startsWith('rmu')){ for(let i=0;i<node.states.length;i++) createPort(wrap, node, 45+(i*70)+10, 175, 'bay_'+i); }

            makeDraggable(wrap, node); canvas.appendChild(wrap);
        });
        renderWires();
    }

    function getRMUHtml(node) {
        const busC = node.powered ? 'var(--on)' : 'var(--off)';
        let h = `<div style="margin-top:30px; position:relative; margin-left:10px">
            <input class="mc-label" style="left:${node.width-80}px" value="${node.label}" onchange="updateLabel('${node.id}', this.value)">
            <div class="symbol-box" style="width:${node.width}px; height:145px">
            <div style="position:absolute; height:4px; width:80%; left:10%; top:20px; background:${busC}"></div>`;
        for(let i=0; i<node.states.length; i++){
            const bx=45+(i*70), s=node.states[i], wirePowered = getPortPower(node.id, 'bay_'+i);
            const hasPower = wirePowered || (node.powered && s);
            const armColor = (s && hasPower) ? 'var(--on)' : 'var(--off)';
            const lineColor = hasPower ? 'var(--on)' : 'var(--off)';
            h += `<div style="position:absolute; width:2px; height:15px; left:${bx-1}px; top:20px; background:${busC}"></div>
                  <div style="position:absolute; width:2px; height:25px; left:${bx-1}px; top:35px; background:${armColor}; transform-origin: bottom center; transform:rotate(${s?0:35}deg)"><div class="pivot" style="top:-3px; background:inherit"></div><div class="pivot" style="bottom:-3px; background:inherit"></div></div>
                  <div style="position:absolute; width:2px; height:75px; left:${bx-1}px; top:60px; background:${lineColor}"></div>
                  <div class="rmu-ctrl-box" style="left:${bx-21}px; top:85px">
                     <button class="btn-s" style="background:${s?'#b30000':'#444'}" onclick="controlMC_RMU('${node.id}', ${i}, true)">ON</button>
                     <button class="btn-s" style="background:${!s?'#006400':'#444'}" onclick="controlMC_RMU('${node.id}', ${i}, false)">OFF</button>
                  </div>`;
        }
        return h + `</div></div>`;
    }

    // --- SNAP (DYN) & CONNECTION LOGIC ---
    function onBusClick(id, e) {
        const node = data.nodes.find(n => n.id === id);
        const rect = e.currentTarget.getBoundingClientRect();
        let rx = (e.clientX - rect.left) / currentZoom;
        const ry = 46; 

        if (!selectedPort) {
            selectedPort = { id, port: 'bus', rx, ry, abs: { x: node.x + rx, y: node.y + ry } };
            ghostPath.style.display = 'block';
        } else {
            if (selectedPort.id !== id || selectedPort.port !== 'bus') {
                data.wires.push({ 
                    from: selectedPort.id, 
                    fromPort: selectedPort.port, 
                    fRel: { x: selectedPort.rx, y: selectedPort.ry }, 
                    to: id, 
                    toPort: 'bus', 
                    tRel: { x: rx, y: ry }, 
                    midY: (selectedPort.abs.y + node.y + ry) / 2 
                });
                pushHistory();
            }
            selectedPort = null; ghostPath.style.display = 'none'; render();
        }
    }

    function createPort(p, n, rx, ry, name) {
        const d=document.createElement('div'); d.className='port'; d.style.left=rx+'px'; d.style.top=ry+'px';
        d.onclick=(e)=>{e.stopPropagation(); onPortClick(n.id, name, rx, ry);}; p.appendChild(d);
    }
    function onPortClick(id, port, rx, ry) {
        const n=data.nodes.find(n=>n.id===id);
        if(!selectedPort){ selectedPort={id, port, rx, ry, abs:{x:n.x+rx, y:n.y+ry}}; ghostPath.style.display='block'; }
        else {
            if(selectedPort.id !== id){
                data.wires.push({ from: selectedPort.id, fromPort: selectedPort.port, fRel:{x:selectedPort.rx,y:selectedPort.ry}, to:id, toPort:port, tRel:{x:rx,y:ry}, midY: (selectedPort.abs.y + n.y+ry)/2 });
                pushHistory();
            }
            selectedPort=null; ghostPath.style.display='none'; render();
        }
    }

    function renderWires() {
        let svg = '';
        data.wires.forEach((w, i) => {
            const n1=data.nodes.find(n=>n.id===w.from), n2=data.nodes.find(n=>n.id===w.to);
            if(!n1 || !n2) return;
            const isP = (n1.powered && isPortActive(n1, w.fromPort)) || (n2.powered && isPortActive(n2, w.toPort));
            const x1=n1.x+w.fRel.x, y1=n1.y+w.fRel.y, x2=n2.x+w.tRel.x, y2=n2.y+w.tRel.y;
            svg += `<path d="M ${x1} ${y1} V ${w.midY} H ${x2} V ${y2}" class="wire-path ${isP?'powered':''}" onmousedown="startDragWire(event, ${i})" onclick="if(event.ctrlKey) deleteWire(${i})"/>`;
        });
        connLayer.innerHTML = `<path id="ghost-path" style="stroke:#fff;stroke-width:2;stroke-dasharray:5;fill:none;display:${selectedPort?'block':'none'}" d="${ghostPath.getAttribute('d')}"></path>` + svg;
    }

    function startDragWire(e, i) { e.stopPropagation(); draggingWireIdx = i; }
    function stopDragging() { if(draggingWireIdx!==null){ draggingWireIdx=null; pushHistory(); } }
    canvas.onmousemove = (e) => {
        const rect=canvas.getBoundingClientRect(), mx=(e.clientX-rect.left)/currentZoom, my=(e.clientY-rect.top)/currentZoom;
        if(selectedPort) ghostPath.setAttribute('d', `M ${selectedPort.abs.x} ${selectedPort.abs.y} V ${my} H ${mx} V ${my}`);
        if(draggingWireIdx !== null) { data.wires[draggingWireIdx].midY = my; renderWires(); }
    };

    function evDrag(e, type) { e.dataTransfer.setData("type", type); }
    function evDrop(e) {
        e.preventDefault(); const rect=canvasContainer.getBoundingClientRect(), x=(e.clientX-rect.left)/currentZoom, y=(e.clientY-rect.top)/currentZoom, type=e.dataTransfer.getData("type"); if(!type) return;
        let node={id:'n'+Date.now(), type, x, y, label:""};
        if(type==='busbar') node.width=200;
        else if(type.startsWith('rmu')){ const c={rmu2:2,rmu3:3,rmu4:4,rmu5:5}[type]; node.width=90+(c-1)*70; node.states=new Array(c).fill(false); }
        else if(type==='text_box'){ node.label="..."; node.width=150; node.height=50; }
        else node.state=false;
        data.nodes.push(node); pushHistory(); render();
    }

    function controlMC(id, v) { if(prompt("Mật khẩu: 123456")==="123456") { data.nodes.find(n=>n.id===id).state=v; pushHistory(); render(); } }
    function controlMC_RMU(id, b, v) { if(prompt("Mật khẩu: 123456")==="123456") { data.nodes.find(n=>n.id===id).states[b]=v; pushHistory(); render(); } }
    function deleteNode(id) { data.nodes=data.nodes.filter(n=>n.id!==id); data.wires=data.wires.filter(w=>w.from!==id && w.to!==id); render(); pushHistory(); }
    function deleteWire(i) { data.wires.splice(i,1); render(); pushHistory(); }
    function updateLabel(id, v) { data.nodes.find(n=>n.id===id).label=v; pushHistory(); }
    function startResizeBus(e, id) { e.stopPropagation(); const n=data.nodes.find(n=>n.id===id); let sx=e.clientX, sw=n.width; document.onmousemove=(ev)=>{ n.width=sw+(ev.clientX-sx)/currentZoom; render(); }; document.onmouseup=()=>{document.onmousemove=null; pushHistory();}; }
    function makeDraggable(el, node) {
        el.onmousedown=(e)=>{
            if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.classList.contains('port')||e.target.classList.contains('btn-s')||e.target.classList.contains('bus-handle')||e.target.classList.contains('busbar-line')) return;
            let ox=e.clientX, oy=e.clientY; document.onmousemove=(ev)=>{
                node.x=node.x+(ev.clientX-ox)/currentZoom; node.y=node.y+(ev.clientY-oy)/currentZoom; ox=ev.clientX; oy=ev.clientY;
                el.style.left=node.x+'px'; el.style.top=node.y+'px'; renderWires();
            }; document.onmouseup=()=>{document.onmousemove=null; pushHistory();};
        };
    }
    function deselectAll() { selectedPort=null; ghostPath.style.display='none'; }
    render();
</script>
</body>
</html>
