<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLD Engineer Pro v11.0 - Full Devices & Zoom/Pan</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --bg: #0b0b0b; --panel: #1e1e1e; --accent: #4a90e2; --on: #ff0000; --off: #00ff00; --box: #3b5b91; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        .header { height: 50px; background: var(--panel); display: flex; align-items: center; padding: 0 15px; border-bottom: 1px solid #333; justify-content: space-between; z-index: 1001; position: relative; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .project-title { position: absolute; left: 50%; transform: translateX(-50%); color: #edca1a; font-weight: bold; font-size: 14px; text-transform: uppercase; pointer-events: none; white-space: nowrap; }
        
        button { background: #333; color: white; border: 1px solid #555; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 11px; font-weight: bold; transition: 0.2s; }
        button:hover { background: var(--accent); }

        .main { display: flex; height: calc(100% - 50px); position: relative; }
        .sidebar { width: 210px; background: var(--panel); border-right: 1px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; z-index: 1000; }
        .tool-item { background: #2d2d2d; border: 1px solid #444; padding: 10px; border-radius: 6px; cursor: grab; text-align: center; font-size: 11px; user-select: none; }
        .tool-item:hover { border-color: var(--accent); }

        .workspace { flex: 1; position: relative; overflow: hidden; background-image: radial-gradient(#222 1px, transparent 1px); background-size: 30px 30px; cursor: crosshair; }
        #canvas-container { transform-origin: 0 0; width: 6000px; height: 6000px; position: absolute; top: 0; left: 0; }
        #canvas { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        .obj-wrap { position: absolute; cursor: move; z-index: 10; touch-action: none; }
        .delete-btn { position: absolute; top: -20px; left: -10px; color: white; background: #ff4444; cursor: pointer; font-weight: bold; border-radius: 50%; width: 22px; height: 22px; text-align: center; line-height: 20px; border: 2px solid #fff; display: none; z-index: 100; }
        .obj-wrap:hover .delete-btn { display: block; }

        .symbol-box { border: 2px solid var(--box); position: relative; background: rgba(0,0,0,0.4); border-radius: 4px; }
        .sw-clickable { cursor: pointer; pointer-events: auto; }
        .label-text { font-size: 10px; fill: #aaa; pointer-events: none; }

        .port { width: 14px; height: 14px; background: #edca1a; border-radius: 50%; position: absolute; cursor: pointer; z-index: 50; border: 2px solid #000; transform: translate(-50%, -50%); }
        .wire-path { stroke: var(--off); stroke-width: 5; fill: none; pointer-events: stroke; cursor: ns-resize; }
        .wire-path.powered { stroke: var(--on) !important; }

        .mc-box { width: 50px; height: 90px; border: 2px solid var(--box); background: #000; position: absolute; }
        .mc-arm { position: absolute; width: 2px; height: 35px; transform-origin: bottom center; transition: 0.3s; }
        .pivot { position: absolute; width: 6px; height: 6px; border: 1px solid #fff; border-radius: 50%; left: -3px; background: inherit; }
        .mc-label { position: absolute; background: transparent; border: 1px dashed #555; color: #edca1a; font-weight: bold; font-size: 12px; outline: none; }
        .line-v { position: absolute; width: 2px; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: #1a1a1a; border: 1px solid #444; width: 450px; border-radius: 12px; padding: 25px; }
        .project-list { overflow-y: auto; flex: 1; min-height: 250px; margin-top: 10px; border: 1px solid #333; background: #000; }
        .project-item { padding: 12px; border-bottom: 1px solid #222; cursor: pointer; }
    </style>
</head>
<body onmouseup="stopDragging()">

<div class="header">
    <div class="header-left">
        <button onclick="undo()">↩ Undo</button>
        <span id="zoomLabel" style="color:#888; font-size:12px; margin-left:10px">Zoom: 100%</span>
    </div>
    <div class="project-title" id="displayProjectName">DỰ ÁN TRỐNG</div>
    <div style="display:flex; gap:8px">
        <button onclick="handleNew()" style="background:#007bff">TẠO MỚI</button>
        <button onclick="handleSave()" style="background:#28a745">SAVE</button>
        <button onclick="openOpenModal()" style="background:#ffc107; color:black">MỞ</button>
    </div>
</div>

<div class="main">
    <div class="sidebar">
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'mc_tong')">Máy Cắt Tổng</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'mc_feeder')">Máy Cắt Nhánh</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'mba')">Máy Biến Áp</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'busbar')">Thanh Cái</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'text_box')" style="color:#edca1a">Ô Ghi Chú</div>
        <div style="color:#888; font-size:10px; text-align:center; border-top:1px solid #333; padding-top:10px">TỦ RMU</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'rmu2')">RMU 2 Ngăn</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'rmu3')">RMU 3 Ngăn</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'rmu4')">RMU 4 Ngăn</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'rmu5')">RMU 5 Ngăn</div>
        <div style="color:#888; font-size:10px; text-align:center; border-top:1px solid #333; padding-top:10px">MŨI TÊN</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'arrow_up')">Nguồn lên (↑)</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'arrow_down')">Nguồn xuống (↓)</div>
    </div>
    <div class="workspace" id="workspace" ondragover="event.preventDefault()" ondrop="evDrop(event)">
        <div id="canvas-container">
            <div id="canvas">
                <svg id="conn-layer" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5;">
                    <path id="ghost-path" style="stroke:#fff; stroke-width:2; stroke-dasharray:5; fill:none; display:none"></path>
                </svg>
            </div>
        </div>
    </div>
</div>

<!-- Modals -->
<div id="openModal" class="modal"><div class="modal-content"><div style="color:#edca1a">MỞ DỰ ÁN</div><div id="openList" class="project-list"></div><button onclick="confirmOpen()">MỞ</button><button onclick="closeModal('openModal')">HỦY</button></div></div>
<div id="saveModal" class="modal"><div class="modal-content"><div style="color:#28a745">LƯU DỰ ÁN</div><input type="text" id="saveInput" style="width:100%; margin:10px 0; padding:8px; background:#000; color:#fff; border:1px solid #444;"><button onclick="confirmSaveAs()">LƯU</button><button onclick="closeModal('saveModal')">HỦY</button></div></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC9aGNmyKDkHvqQg0CY9SfrmNrMhFQGSzo",
        authDomain: "my-sld-project.firebaseapp.com",
        databaseURL: "https://my-sld-project-default-rtdb.firebaseio.com",
        projectId: "my-sld-project",
        storageBucket: "my-sld-project.firebasestorage.app",
        messagingSenderId: "931677457263",
        appId: "1:931677457263:web:6bd129cd12e53a5f71369a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let data = { nodes: [], wires: [] };
    let history = [];
    let selectedPort = null;
    let draggingWireIdx = null;

    // Zoom/Pan Variables
    let scale = 1.0;
    let offsetX = 0;
    let offsetY = 0;
    let isPanning = false;
    let startPanX = 0;
    let startPanY = 0;

    const workspace = document.getElementById('workspace');
    const canvas = document.getElementById('canvas');
    const canvasContainer = document.getElementById('canvas-container');
    const connLayer = document.getElementById('conn-layer');
    const ghostPath = document.getElementById('ghost-path');

    // --- ZOOM & PAN LOGIC ---
    function updateTransform() {
        canvasContainer.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
        document.getElementById('zoomLabel').innerText = `Zoom: ${Math.round(scale * 100)}%`;
    }

    workspace.onwheel = (e) => {
        e.preventDefault();
        const zoomSpeed = 0.1;
        const delta = e.deltaY > 0 ? -zoomSpeed : zoomSpeed;
        const oldScale = scale;
        scale = Math.min(Math.max(0.1, scale + delta), 5);
        const rect = workspace.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        offsetX -= (mouseX - offsetX) * (scale / oldScale - 1);
        offsetY -= (mouseY - offsetY) * (scale / oldScale - 1);
        updateTransform();
    };

    workspace.onmousedown = (e) => {
        if (e.button === 1 || e.button === 2) {
            isPanning = true;
            startPanX = e.clientX - offsetX;
            startPanY = e.clientY - offsetY;
            workspace.style.cursor = 'grabbing';
            e.preventDefault();
        }
    };

    window.onmousemove = (e) => {
        const rect = workspace.getBoundingClientRect();
        const mx = (e.clientX - rect.left - offsetX) / scale;
        const my = (e.clientY - rect.top - offsetY) / scale;
        if (isPanning) {
            offsetX = e.clientX - startPanX;
            offsetY = e.clientY - startPanY;
            updateTransform();
        }
        if (selectedPort) { ghostPath.setAttribute('d', `M ${selectedPort.abs.x} ${selectedPort.abs.y} V ${my} H ${mx} V ${my}`); }
        if (draggingWireIdx !== null) { data.wires[draggingWireIdx].midY = my; renderWires(); }
    };

    window.onmouseup = () => { isPanning = false; workspace.style.cursor = 'crosshair'; };
    workspace.oncontextmenu = (e) => e.preventDefault();

    // --- DRAG DROP ---
    function evDrag(e, type) { e.dataTransfer.setData("text", type); }
    function evDrop(e) {
        e.preventDefault();
        const type = e.dataTransfer.getData("text");
        if(!type) return;
        const rect = workspace.getBoundingClientRect();
        const x = (e.clientX - rect.left - offsetX) / scale;
        const y = (e.clientY - rect.top - offsetY) / scale;
        let node = {id:'n'+Date.now(), type, x, y, label:""};
        if(type.startsWith('rmu')){ 
            const count = parseInt(type.replace('rmu',''));
            node.states=new Array(count).fill(false); 
            node.earthStates=new Array(count).fill(false); 
        }
        else if(type.startsWith('arrow')) node.powered = false;
        else if(type==='busbar') node.width=200;
        else if(type==='text_box'){ node.label="Ghi chú..."; node.width=150; node.height=50; }
        else node.state=false;
        data.nodes.push(node); render(); pushHistory();
    }

    // --- POWER LOGIC ---
    function solvePower() {
        data.nodes.forEach(n => n.powered = false);
        data.nodes.forEach(n => { 
            if(n.type === 'mc_tong' && n.state && !data.wires.some(w => w.to === n.id && w.toPort === 'top')) n.powered = true;
            if((n.type === 'arrow_up' || n.type === 'arrow_down') && getPortPower(n.id, 'pt')) n.powered = true;
        });
        for(let i=0; i<40; i++) {
            data.wires.forEach(w => {
                const n1=data.nodes.find(n=>n.id===w.from), n2=data.nodes.find(n=>n.id===w.to);
                if(!n1 || !n2) return;
                if(n1.powered && isPortActive(n1, w.fromPort) && isPortActive(n2, w.toPort)) n2.powered = true;
                if(n2.powered && isPortActive(n2, w.toPort) && isPortActive(n1, w.fromPort)) n1.powered = true;
            });
        }
    }
    function isPortActive(n, p) {
        if(n.type.startsWith('mc') || n.type === 'mc_tong') return n.state;
        if(n.type.startsWith('rmu')) return p.startsWith('bay') ? n.states[parseInt(p.split('_')[1])] : true;
        return true;
    }
    function getPortPower(nid, p) {
        const w = data.wires.find(w => (w.from===nid && w.fromPort===p) || (w.to===nid && w.toPort===p));
        if(!w) return false;
        const oid = (w.from===nid)?w.to:w.from, op = (w.from===nid)?w.toPort:w.fromPort, on = data.nodes.find(n=>n.id===oid);
        return on ? (on.powered && isPortActive(on, op)) : false;
    }

    // --- RENDER ---
    function render() {
        Array.from(canvas.children).forEach(c => { if(c.id!=='conn-layer') c.remove(); });
        solvePower();
        data.nodes.forEach(node => {
            const wrap = document.createElement('div'); wrap.className='obj-wrap';
            wrap.style.left=node.x+'px'; wrap.style.top=node.y+'px';
            let html='';

            if(node.type.startsWith('mc') || node.type === 'mc_tong') {
                const p = node.powered, s = node.state;
                html = `<div style="position:relative; width:80px; height:160px;">
                    <input class="mc-label" value="${node.label}" onchange="updateLabel('${node.id}', this.value)" style="position:absolute; top:45px; left:90px; width:150px; text-align:left; outline:none;">
                    <div class="mc-box" onclick="toggleSwitch('${node.id}')" style="left:15px; top:35px; cursor:pointer;">
                        <div class="line-v" style="height:56px; top:-31px; left:24px; background:${p?'var(--on)':'var(--off)'}"></div>
                        <div class="mc-arm" style="transform:rotate(${s?0:35}deg); left:24px; top:25px; background:${s?(p?'var(--on)':'white'):'var(--off)'}"><div class="pivot" style="top:-3px; background:inherit"></div><div class="pivot" style="bottom:-3px; background:inherit"></div></div>
                        <div class="line-v" style="height:65px; top:60px; left:24px; background:${(p && s)?'var(--on)':'var(--off)'}"></div>
                    </div></div>`;
            } else if(node.type === 'mba') {
                html = `<div style="position:relative; width:80px; height:130px;">
                    <input class="mc-label" value="${node.label}" onchange="updateLabel('${node.id}', this.value)" style="position:absolute; left:90px; top:50%; transform:translateY(-50%); width:180px; text-align:left; outline:none;">
                    <div class="line-v" style="left:39px; height:30px; top:0px; background:${node.powered?'var(--on)':'var(--off)'}"></div>
                    <svg width="80" height="60" style="position:absolute; top:30px; left:0">
                        <circle cx="40" cy="18" r="18" stroke="${node.powered?'var(--on)':'var(--box)'}" stroke-width="2" fill="none"/>
                        <circle cx="40" cy="38" r="18" stroke="${node.powered?'var(--on)':'var(--box)'}" stroke-width="2" fill="none"/>
                    </svg>
                    <div class="line-v" style="left:39px; height:40px; top:90px; background:${node.powered?'var(--on)':'var(--off)'}"></div></div>`;
            } else if(node.type.startsWith('rmu')) {
                html = getRMUHtml(node);
            } else if(node.type === 'busbar') {
                html=`<div class="busbar-container"><input class="mc-label" value="${node.label}" onchange="updateLabel('${node.id}', this.value)" style="top:15px; left:0; outline:none">
                    <div class="busbar-line" style="width:${node.width}px; background:${node.powered?'var(--on)':'var(--off)'}" onclick="onBusClick('${node.id}', event)"></div>
                    <div class="bus-handle" onmousedown="startResizeBus(event, '${node.id}')"></div></div>`;
            } else if(node.type === 'text_box') {
                html=`<div style="border:1px dashed #edca1a; width:${node.width}px; height:${node.height}px; background:rgba(237,202,26,0.05)"><textarea style="width:100%; height:100%; background:transparent; border:none; color:white; text-align:center; outline:none; resize:none" onchange="updateLabel('${node.id}', this.value)">${node.label}</textarea></div>`;
            } else if(node.type.startsWith('arrow')) {
                const color = node.powered ? 'var(--on)' : 'var(--off)';
                html = `<svg width="40" height="60"><path d="${node.type==='arrow_up'?'M20 55 V5 M10 20 L20 5 L30 20':'M20 5 V55 M10 40 L20 55 L30 40'}" stroke="${color}" stroke-width="4" fill="none"/></svg>`;
            }

            wrap.innerHTML=html;
            const del=document.createElement('div'); del.className='delete-btn'; del.innerHTML='×';
            del.onclick=(e)=>{e.stopPropagation(); deleteNode(node.id);}; wrap.appendChild(del);

            if(node.type.startsWith('mc')) { createPort(wrap, node, 40, 4, 'top'); createPort(wrap, node, 40, 160, 'bottom'); }
            else if(node.type==='mba') { createPort(wrap, node, 40, 0, 'top'); createPort(wrap, node, 40, 130, 'bottom'); }
            else if(node.type.startsWith('rmu')){ for(let i=0;i<node.states.length;i++) createPort(wrap, node, 50+(i*80), 200, 'bay_'+i); }
            else if(node.type.startsWith('arrow')){ createPort(wrap, node, 20, 30, 'pt'); }

            makeDraggable(wrap, node); canvas.appendChild(wrap);
        });
        renderWires();
    }

    function getRMUHtml(node) {
        const busC = node.powered ? 'var(--on)' : 'var(--off)';
        const count = node.states.length;
        const width = count * 80 + 20;
        let h = `<div style="margin-top:40px; position:relative">
            <div class="symbol-box" style="width:${width}px; height:160px">
                <svg width="${width}" height="160" style="pointer-events:none">
                    <line x1="10" y1="20" x2="${width-10}" y2="20" stroke="${busC}" stroke-width="4"/>`;
        for(let i=0; i<count; i++) {
            const x = 50 + (i * 80);
            const s = node.states[i], es = node.earthStates[i], wireP = getPortPower(node.id, 'bay_'+i);
            const hasPower = wireP || (node.powered && s), lineC = hasPower ? 'var(--on)' : 'var(--off)';
            const armC = (s && hasPower) ? 'var(--on)' : 'var(--off)', earthC = es ? 'var(--on)' : 'var(--off)';
            h += `<line x1="${x}" y1="20" x2="${x}" y2="40" stroke="${busC}" stroke-width="2"/>
                <g class="sw-clickable" onclick="toggleRMUSwitch('${node.id}', ${i}, 'main')">
                    <line x1="${x}" y1="40" x2="${x}" y2="${s?70:65}" stroke="${armC}" stroke-width="3" transform="${s?'':'rotate(-35,'+x+',70)'}"/>
                    <circle cx="${x}" cy="40" r="3" fill="${busC}"/><circle cx="${x}" cy="70" r="3" fill="${lineC}"/>
                    <text x="${x+8}" y="55" class="label-text" fill="white">-7</text>
                </g><line x1="${x}" y1="70" x2="${x}" y2="120" stroke="${lineC}" stroke-width="2"/>
                <g class="sw-clickable" onclick="toggleRMUSwitch('${node.id}', ${i}, 'earth')">
                    <line x1="${x}" y1="100" x2="${x+18}" y2="100" stroke="${lineC}" stroke-width="2"/>
                    <line x1="${x+18}" y1="100" x2="${x+32}" y2="${es?100:85}" stroke="${earthC}" stroke-width="3" transform="${es?'':'rotate(-35,'+ (x+36) +',100)'}"/>
                    <circle cx="${x+18}" cy="100" r="2" fill="${lineC}"/>
                    <line x1="${x+36}" y1="90" x2="${x+36}" y2="110" stroke="${earthC}" stroke-width="1.5"/>
                    <text x="${x+18}" y="85" class="label-text" fill="white">-76</text>
                </g><line x1="${x}" y1="120" x2="${x}" y2="160" stroke="${lineC}" stroke-width="2"/>`;
        }
        h += `</svg></div></div>`; return h;
    }

    function toggleSwitch(id) { if(prompt("MK: 123456")==="123456") { const n = data.nodes.find(n=>n.id===id); n.state = !n.state; render(); pushHistory(); } }
    function toggleRMUSwitch(nodeId, bayIdx, type) {
        if(prompt("MK: 123456")!=="123456") return;
        const n = data.nodes.find(n=>n.id===nodeId);
        if(type === 'main') { if(!n.states[bayIdx] && n.earthStates[bayIdx]) { alert("Dao tiếp đất -76 đang Đóng!"); return; } n.states[bayIdx] = !n.states[bayIdx]; }
        else { if(!n.earthStates[bayIdx]) { if(n.states[bayIdx]) { alert("Dao -7 đang Đóng!"); return; } if(getPortPower(nodeId, 'bay_'+bayIdx)) { alert("Đường dây có điện!"); return; } } n.earthStates[bayIdx] = !n.earthStates[bayIdx]; }
        render(); pushHistory();
    }

    function createPort(p, n, rx, ry, name) { const d=document.createElement('div'); d.className='port'; d.style.left=rx+'px'; d.style.top=ry+'px'; d.onclick=(e)=>{e.stopPropagation(); onPortClick(n.id, name, rx, ry);}; p.appendChild(d); }
    function onPortClick(id, port, rx, ry) { const n=data.nodes.find(n=>n.id===id); if(!selectedPort){ selectedPort={id, port, rx, ry, abs:{x:n.x+rx, y:n.y+ry}}; ghostPath.style.display='block'; } else { if(selectedPort.id !== id){ data.wires.push({ from: selectedPort.id, fromPort: selectedPort.port, fRel:{x:selectedPort.rx,y:selectedPort.ry}, to:id, toPort:port, tRel:{x:rx,y:ry}, midY: (selectedPort.abs.y + n.y+ry)/2 }); pushHistory(); } selectedPort=null; ghostPath.style.display='none'; render(); } }
    function onBusClick(id, e) { const node=data.nodes.find(n=>n.id===id), rect=workspace.getBoundingClientRect(), rx=(e.clientX-rect.left-offsetX)/scale - node.x; if(!selectedPort){ selectedPort={id, port:'bus', rx, ry:46, abs:{x:node.x+rx, y:node.y+46}}; ghostPath.style.display='block'; } else { data.wires.push({ from:selectedPort.id, fromPort:selectedPort.port, fRel:{x:selectedPort.rx,y:selectedPort.ry}, to:id, toPort:'bus', tRel:{x:rx,y:46}, midY:(selectedPort.abs.y+node.y+46)/2 }); selectedPort=null; ghostPath.style.display='none'; render(); pushHistory(); } }
    function renderWires() { let svg = ''; data.wires.forEach((w, i) => { const n1=data.nodes.find(n=>n.id===w.from), n2=data.nodes.find(n=>n.id===w.to); if(!n1 || !n2) return; const isP = (n1.powered && (n1.type.startsWith('mc')?n1.state:true)) || (n2.powered && (n2.type.startsWith('mc')?n2.state:true)); const x1=n1.x+w.fRel.x, y1=n1.y+w.fRel.y, x2=n2.x+w.tRel.x, y2=n2.y+w.tRel.y; svg += `<path d="M ${x1} ${y1} V ${w.midY} H ${x2} V ${y2}" class="wire-path ${isP?'powered':''}" onmousedown="draggingWireIdx = ${i}" onclick="if(event.ctrlKey) deleteWire(${i})"/>`; }); connLayer.innerHTML = ghostPath.outerHTML + svg; }
    function stopDragging() { draggingWireIdx = null; }
    function pushHistory() { const s=JSON.stringify(data); if(!history.length || history[history.length-1]!==s) { history.push(s); if(history.length>50) history.shift(); } }
    function undo() { if(history.length>1){ history.pop(); data=JSON.parse(history[history.length-1]); render(); } }
    function updateLabel(id, v) { data.nodes.find(n=>n.id===id).label=v; pushHistory(); }
    function deleteNode(id) { data.nodes=data.nodes.filter(n=>n.id!==id); data.wires=data.wires.filter(w=>w.from!==id && w.to!==id); render(); pushHistory(); }
    function deleteWire(i) { data.wires.splice(i,1); render(); pushHistory(); }
    function startResizeBus(e, id) { e.stopPropagation(); const n=data.nodes.find(n=>n.id===id); let sx=e.clientX, sw=n.width; document.onmousemove=(ev)=>{ n.width=sw+(ev.clientX-sx)/scale; render(); }; document.onmouseup=()=>{document.onmousemove=null; pushHistory();}; }
    function makeDraggable(el, node) { el.onmousedown=(e)=>{ if(e.button!==0 || e.target.tagName==='INPUT'||e.target.classList.contains('port')) return; let ox=e.clientX, oy=e.clientY; document.onmousemove=(ev)=>{ node.x+=(ev.clientX-ox)/scale; node.y+=(ev.clientY-oy)/scale; ox=ev.clientX; oy=ev.clientY; el.style.left=node.x+'px'; el.style.top=node.y+'px'; renderWires(); }; document.onmouseup=()=>{document.onmousemove=null; pushHistory();}; }; }
    render();
</script>
</body>
