<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLD Engineer Pro v7.6 - Smart Save & Text Tool</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --bg: #0b0b0b; --panel: #1e1e1e; --accent: #4a90e2; --on: #ff0000; --off: #00ff00; --box: #3b5b91; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        .header { height: 50px; background: var(--panel); display: flex; align-items: center; padding: 0 15px; border-bottom: 1px solid #333; justify-content: space-between; z-index: 100; position: relative; }
        .top-btns { display: flex; gap: 8px; }
        button { background: #333; color: white; border: 1px solid #555; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 12px; transition: 0.2s; }
        button:hover { background: var(--accent); }

        .main { display: flex; height: calc(100% - 50px); }
        .sidebar { width: 200px; background: var(--panel); border-right: 1px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .tool-item { background: #2d2d2d; border: 1px solid #444; padding: 12px; border-radius: 6px; cursor: grab; text-align: center; font-size: 11px; user-select: none; }
        .tool-item:hover { border-color: var(--accent); background: #383838; }

        .workspace { flex: 1; position: relative; overflow: auto; background-image: radial-gradient(#222 1px, transparent 1px); background-size: 20px 20px; }
        #canvas { width: 3000px; height: 2000px; position: relative; }

        /* Objects */
        .obj-wrap { position: absolute; cursor: move; min-width: 80px; z-index: 10; touch-action: none; }
        .delete-btn { position: absolute; top: -20px; left: -10px; color: white; background: #ff4444; cursor: pointer; font-weight: bold; font-size: 16px; display: none; z-index: 1000; border-radius: 50%; width: 22px; height: 22px; text-align: center; line-height: 20px; border: 2px solid #fff; }
        .obj-wrap:hover .delete-btn { display: block; }

        /* RMU Nút điều khiển */
        .rmu-ctrl-box { position: absolute; display: flex; flex-direction: column; gap: 2px; z-index: 100; }
        .btn-s { padding: 2px; font-size: 9px; color: white; border: none; border-radius: 2px; cursor: pointer; min-width: 35px; border: 1px solid #000; }

        /* Text Box Tool */
        .text-box-container { border: 1px dashed #edca1a; display: flex; align-items: center; justify-content: center; background: rgba(237, 202, 26, 0.05); overflow: hidden; position: relative; }
        .text-box-input { background: transparent; border: none; color: white; width: 100%; height: 100%; text-align: center; outline: none; resize: none; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: inherit; }
        .resize-handle { width: 12px; height: 12px; background: #edca1a; position: absolute; right: 0; bottom: 0; cursor: nwse-resize; z-index: 101; border-radius: 2px; }

        /* Project Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: #1a1a1a; border: 1px solid #444; width: 380px; border-radius: 10px; padding: 20px; max-height: 85%; display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .modal-title { font-weight: bold; color: #edca1a; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between; font-size: 14px; }
        .project-list { overflow-y: auto; flex: 1; margin-top: 10px; }
        .project-item { padding: 12px; background: #2a2a2a; margin-bottom: 6px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #444; }
        .project-item:hover { background: #333; border-left-color: var(--accent); }
        .btn-overwrite { font-size: 10px; background: #4a90e2; padding: 4px 8px; border-radius: 3px; border: none; }
        
        .save-input-group { display: flex; gap: 5px; margin-bottom: 15px; }
        .save-input { flex: 1; background: #000; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 4px; outline: none; font-size: 13px; }
        .save-input:focus { border-color: var(--accent); }

        /* Graphics */
        .mc-container { position: relative; margin-top: 30px; margin-left: 10px; }
        .mc-box { width: 50px; height: 90px; border: 2px solid var(--box); background: #000; position: relative; pointer-events: none; }
        .line-v { position: absolute; width: 2px; left: 24px; }
        .mc-arm { position: absolute; width: 2px; left: 24px; top: 25px; height: 35px; transform-origin: bottom center; transition: 0.3s; }
        .pivot { position: absolute; width: 6px; height: 6px; border: 1px solid #fff; border-radius: 50%; left: -3px; background: inherit; }
        .mc-label { position: absolute; left: 65px; top: -30px; background: transparent; border: 1px dashed #555; color: #edca1a; font-weight: bold; font-size: 13px; width: 120px; outline: none; padding: 2px; }
        .btn-ctrl { padding: 4px 8px; font-size: 10px; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; color: white; min-width: 60px; }
        .btn-on { background: #b30000; } .btn-off { background: #006400; }

        .busbar-container { position: relative; display: flex; align-items: center; padding-top: 40px; }
        .busbar-line { height: 8px; min-width: 50px; cursor: move; border-radius: 4px; }
        .bus-handle { width: 10px; height: 20px; background: #fff; position: absolute; right: 0; top: 34px; cursor: ew-resize; z-index: 10; }
        .port { width: 14px; height: 14px; background: #edca1a; border-radius: 50%; position: absolute; cursor: crosshair; z-index: 50; border: 2px solid #000; transform: translate(-50%, -50%); }
        svg.conn-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .wire { stroke: var(--off); stroke-width: 4; fill: none; pointer-events: stroke; cursor: pointer; }
        .wire.powered { stroke: var(--on); }
        .wire-label-input { position: absolute; background: rgba(0,0,0,0.7); border: 1px solid #444; color: #00ff00; font-size: 10px; text-align: center; width: 100px; transform: translate(-50%, -100%); z-index: 20; border-radius: 2px; outline: none; }
        .symbol-box { border: 2px solid var(--box); position: relative; background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<div class="header">
    <h2 style="font-size:16px; color:#edca1a; margin:0">SLD ENGINEER PRO v7.6</h2>
    <div class="top-btns">
        <button onclick="undo()" style="background:#555">↩ Undo</button>
        <button onclick="clearCanvas()">Làm trắng</button>
        <button onclick="openModal('load')" style="background:#ffc107; color:black; font-weight:bold">MỞ DỰ ÁN</button>
        <button onclick="openModal('save')" style="background:#28a745; font-weight:bold">LƯU ĐÁM MÂY</button>
    </div>
</div>

<!-- Modal chung cho Mở và Lưu -->
<div id="projectModal" class="modal">
    <div class="modal-content">
        <div class="modal-title">
            <span id="modalTitleText">DANH SÁCH DỰ ÁN</span>
            <span style="cursor:pointer" onclick="closeModal()">✖</span>
        </div>
        
        <!-- Phần Lưu mới (Chỉ hiện khi nhấn Lưu) -->
        <div id="saveNewGroup" class="save-input-group">
            <input type="text" id="newProjectName" class="save-input" placeholder="Tên dự án mới...">
            <button onclick="confirmSaveNew()" style="background:#28a745; border:none; padding:8px 15px">Lưu mới</button>
        </div>

        <div style="font-size: 11px; color: #888; margin-bottom: 5px;" id="modalInstruction">Chọn dự án bên dưới để thao tác:</div>
        <div id="projectList" class="project-list"></div>
        <button style="margin-top:15px; background:#444" onclick="closeModal()">Đóng</button>
    </div>
</div>

<div class="main">
    <div class="sidebar">
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'mc_tong')">Máy Cắt Tổng</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'mc_feeder')">Máy Cắt Đường Dây</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'mba')">Máy Biến Áp</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'busbar')">Thanh Cái</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'text_box')" style="color:#edca1a; font-weight:bold">Ghi Chú Văn Bản</div>
        <div style="border-top:1px solid #444; margin:10px 0; padding-top:10px; color:#888; font-size:10px; text-align:center">HỆ THỐNG RMU</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'rmu2')">RMU 2 Ngăn</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'rmu3')">RMU 3 Ngăn</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'rmu4')">RMU 4 Ngăn</div>
        <div class="tool-item" draggable="true" ondragstart="evDrag(event, 'rmu5')">RMU 5 Ngăn</div>
    </div>
    <div class="workspace" id="ws" onclick="deselectAll()">
        <div id="canvas">
            <svg id="conn-layer" class="conn-layer">
                <path id="ghost-path" class="ghost-line" style="display:none"></path>
            </svg>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC9aGNmyKDkHvqQg0CY9SfrmNrMhFQGSzo",
        authDomain: "my-sld-project.firebaseapp.com",
        databaseURL: "https://my-sld-project-default-rtdb.firebaseio.com",
        projectId: "my-sld-project",
        storageBucket: "my-sld-project.firebasestorage.app",
        messagingSenderId: "931677457263",
        appId: "1:931677457263:web:6bd129cd12e53a5f71369a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const canvas = document.getElementById('canvas');
    const ws = document.getElementById('ws');
    const connLayer = document.getElementById('conn-layer');
    const ghostPath = document.getElementById('ghost-path');
    let data = { nodes: [], wires: [] };
    let history = [];
    let selectedPort = null;
    let draggingWire = null;
    const PASS = "123456";

    // --- QUẢN LÝ DỰ ÁN THÔNG MINH ---
    let modalMode = 'load'; // 'load' hoặc 'save'

    function openModal(mode) {
        modalMode = mode;
        const modal = document.getElementById('projectModal');
        const listDiv = document.getElementById('projectList');
        const title = document.getElementById('modalTitleText');
        const saveGroup = document.getElementById('saveNewGroup');
        const instruct = document.getElementById('modalInstruction');

        modal.style.display = 'flex';
        listDiv.innerHTML = "Đang tải...";
        
        if (mode === 'save') {
            title.innerText = "LƯU DỰ ÁN LÊN ĐÁM MÂY";
            saveGroup.style.display = 'flex';
            instruct.innerText = "Hoặc chọn một dự án cũ để GHI ĐÈ:";
        } else {
            title.innerText = "MỞ DỰ ÁN TỪ ĐÁM MÂY";
            saveGroup.style.display = 'none';
            instruct.innerText = "Chọn một dự án để mở bản vẽ:";
        }

        db.ref('projects').once('value', (s) => {
            listDiv.innerHTML = "";
            if (!s.exists()) { listDiv.innerHTML = "Chưa có dữ liệu."; return; }
            s.forEach((child) => {
                const name = child.key;
                const item = document.createElement('div');
                item.className = 'project-item';
                item.innerHTML = `<span>📁 ${name}</span> ${mode==='save'?'<button class="btn-overwrite">GHI ĐÈ</button>':''}`;
                item.onclick = () => {
                    if (mode === 'save') confirmOverwrite(name);
                    else loadProject(name);
                };
                listDiv.appendChild(item);
            });
        });
    }

    function confirmSaveNew() {
        const name = document.getElementById('newProjectName').value.trim();
        if (!name) { alert("Vui lòng nhập tên!"); return; }
        saveData(name, false);
    }

    function confirmOverwrite(name) {
        if (confirm(`Bạn có chắc chắn muốn GHI ĐÈ lên dự án "${name}" không? Dữ liệu cũ sẽ bị mất.`)) {
            saveData(name, true);
        }
    }

    function saveData(name, isOverwrite) {
        db.ref('projects/' + name).set(data).then(() => {
            alert(isOverwrite ? "Đã ghi đè thành công!" : "Đã lưu dự án mới thành công!");
            closeModal();
            document.getElementById('newProjectName').value = "";
        });
    }

    function loadProject(name) {
        db.ref('projects/' + name).once('value', (s) => {
            if (s.exists()) {
                data = s.val(); 
                if (!data.wires) data.wires = [];
                render(); pushHistory(); closeModal();
                alert("Đã mở dự án: " + name);
            }
        });
    }

    function closeModal() { document.getElementById('projectModal').style.display = 'none'; }

    // --- LOGIC HỆ THỐNG ---
    function pushHistory() {
        const state = JSON.stringify(data);
        if (history.length === 0 || history[history.length - 1] !== state) {
            history.push(state);
            if (history.length > 50) history.shift();
        }
    }

    function undo() {
        if (history.length <= 1) return;
        history.pop();
        data = JSON.parse(history[history.length - 1]);
        render();
    }

    function evDrag(ev, type) { ev.dataTransfer.setData("type", type); }
    canvas.ondragover = (e) => e.preventDefault();
    canvas.ondrop = (e) => {
        e.preventDefault();
        const type = e.dataTransfer.getData("type");
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left + ws.scrollLeft;
        const y = e.clientY - rect.top + ws.scrollTop;
        
        if (type === 'text_box') {
            data.nodes.push({ id: 'n'+Date.now(), type, x, y, label: "Nhập văn bản...", width: 150, height: 50 });
        } else {
            let width = 250, count = 2;
            if (type === 'rmu2') width = 160;
            else if (type === 'rmu3') { width = 230; count = 3; }
            else if (type === 'rmu4') { width = 300; count = 4; }
            else if (type === 'rmu5') { width = 370; count = 5; }
            data.nodes.push({ id: 'n'+Date.now(), type, x, y, label: "", state: false, width, states: new Array(count).fill(false), powered: false });
        }
        pushHistory(); render();
    };

    function solvePower() {
        data.nodes.forEach(n => n.powered = false);
        data.nodes.forEach(n => { if (n.type === 'mc_tong' && !data.wires.some(w => w.to === n.id && w.toPort === 'top')) n.powered = true; });
        for (let i = 0; i < 20; i++) {
            data.wires.forEach(w => {
                const n1 = data.nodes.find(n => n.id === w.from), n2 = data.nodes.find(n => n.id === w.to);
                if (!n1 || !n2) return;
                if (n1.powered && isPortActive(n1, w.fromPort)) {
                    if (n2.type.startsWith('rmu') && w.toPort.startsWith('bay')) {
                        if(n2.states[parseInt(w.toPort.split('_')[1])]) n2.powered = true;
                    } else n2.powered = true;
                }
                if (n2.powered && isPortActive(n2, w.toPort)) {
                    if (n1.type.startsWith('rmu') && w.fromPort.startsWith('bay')) {
                        if(n1.states[parseInt(w.fromPort.split('_')[1])]) n1.powered = true;
                    } else n1.powered = true;
                }
            });
        }
    }

    function isPortActive(node, pName) {
        if (node.type.startsWith('mc')) return node.state;
        if (node.type.startsWith('rmu') && pName.startsWith('bay')) return node.states[parseInt(pName.split('_')[1])];
        return true;
    }

    function render() {
        Array.from(canvas.children).forEach(c => { if (c.id !== 'conn-layer') c.remove(); });
        solvePower();
        data.nodes.forEach(node => {
            const wrap = document.createElement('div');
            wrap.className = 'obj-wrap';
            wrap.style.left = node.x + 'px'; wrap.style.top = node.y + 'px';
            
            let html = '';
            if (node.type === 'text_box') {
                const fSize = Math.max(10, node.height * 0.4);
                html = `<div class="text-box-container" style="width:${node.width}px; height:${node.height}px;">
                            <textarea class="text-box-input" style="font-size:${fSize}px" onchange="updateLabel('${node.id}', this.value)">${node.label}</textarea>
                            <div class="resize-handle" onmousedown="startResizeText(event, '${node.id}')"></div>
                        </div>`;
            } else if (node.type.startsWith('mc')) {
                html = `<div class="mc-container">
                    <input class="mc-label" placeholder="Tên MC..." value="${node.label}" onchange="updateLabel('${node.id}', this.value)">
                    <div class="mc-box">
                        <div class="line-v" style="height:56px; top:-31px; background:${node.powered?'var(--on)':'white'}"></div>
                        <div class="mc-arm" style="transform:rotate(${node.state?0:35}deg); background:${node.state?(node.powered?'var(--on)':'white'):'var(--off)'}"><div class="pivot" style="top:-3px; background:inherit"></div><div class="pivot" style="bottom:-3px; background:inherit"></div></div>
                        <div class="line-v" style="height:65px; top:60px; background:${(node.powered && node.state)?'var(--on)':'var(--off)'}"></div>
                    </div>
                    <div style="position:absolute; left:65px; top:30px; display:flex; flex-direction:column; gap:4px">
                        <button class="btn-ctrl btn-on" onclick="controlMC('${node.id}', true)">ĐÓNG</button>
                        <button class="btn-ctrl btn-off" onclick="controlMC('${node.id}', false)">CẮT</button>
                    </div>
                </div>`;
            } else if (node.type === 'mba') {
                html = `<div style="margin-top:30px; position:relative; margin-left:10px">
                    <input class="mc-label" value="${node.label}" onchange="updateLabel('${node.id}', this.value)">
                    <div class="line-v" style="left:29px; height:30px; top:-30px; background:${node.powered?'var(--on)':'white'}"></div>
                    <svg width="60" height="60"><circle cx="30" cy="20" r="18" stroke="${node.powered?'var(--on)':'var(--box)'}" stroke-width="2" fill="none"/><circle cx="30" cy="40" r="18" stroke="${node.powered?'var(--on)':'var(--box)'}" stroke-width="2" fill="none"/></svg>
                    <div class="line-v" style="left:29px; height:40px; top:60px; background:${node.powered?'var(--on)':'var(--off)'}"></div>
                </div>`;
            } else if (node.type === 'busbar') {
                html = `<div class="busbar-container">
                    <input class="mc-label" style="top:15px; left:0" value="${node.label}" onchange="updateLabel('${node.id}', this.value)">
                    <div class="busbar-line" style="width:${node.width}px; background:${node.powered?'var(--on)':'var(--off)'}" onclick="onBusClick('${node.id}', event)"></div>
                    <div class="bus-handle" onmousedown="startResizeBus(event, '${node.id}')"></div>
                </div>`;
            } else if (node.type.startsWith('rmu')) {
                html = getRMUHtml(node);
            }

            wrap.innerHTML = html;
            const del = document.createElement('div'); del.className = 'delete-btn'; del.innerHTML = '×';
            del.onclick = (e) => { e.stopPropagation(); deleteNode(node.id); };
            wrap.appendChild(del);

            if (node.type.startsWith('mc')) { createPort(wrap, node, 35, 0, 'top'); createPort(wrap, node, 35, 155, 'bottom'); }
            else if (node.type === 'mba') { createPort(wrap, node, 40, 0, 'top'); createPort(wrap, node, 40, 130, 'bottom'); }
            else if (node.type.startsWith('rmu')) { for (let i = 0; i < node.states.length; i++) createPort(wrap, node, 45 + (i * 70) + 10, 155, 'bay_'+i); }

            makeDraggable(wrap, node);
            canvas.appendChild(wrap);
        });
        renderWires();
    }

    function getRMUHtml(node) {
        let h = `<div style="margin-top:30px; position:relative; margin-left:10px">
                    <input class="mc-label" style="left:${node.width-80}px" value="${node.label}" onchange="updateLabel('${node.id}', this.value)">
                    <div class="symbol-box" style="width:${node.width}px; height:125px">
                    <div style="position:absolute; height:2px; width:80%; left:10%; top:20px; background:${node.powered?'var(--on)':'white'}"></div>`;
        for (let i = 0; i < node.states.length; i++) {
            let bx = 45 + (i * 70), s = node.states[i];
            let botCol = (node.powered && s) ? 'var(--on)' : 'var(--off)';
            let armCol = s ? (node.powered ? 'var(--on)' : 'white') : 'var(--off)';
            h += `<div style="position:absolute; width:2px; height:15px; left:${bx-1}px; top:20px; background:${node.powered?'var(--on)':'white'}"></div>
                  <div style="position:absolute; width:2px; height:25px; left:${bx-1}px; top:35px; background:${armCol}; transform-origin: bottom center; transform:rotate(${s?0:35}deg)"><div class="pivot" style="top:-3px; background:inherit"></div><div class="pivot" style="bottom:-3px; background:inherit"></div></div>
                  <div style="position:absolute; width:2px; height:55px; left:${bx-1}px; top:60px; background:${botCol}"></div>
                  <div class="rmu-ctrl-box" style="left:${bx-50}px; top:75px">
                     <button class="btn-s" style="background:${s?'#b30000':'#444'}" onclick="controlRMU('${node.id}', ${i}, true)">ON</button>
                     <button class="btn-s" style="background:${!s?'#006400':'#444'}" onclick="controlRMU('${node.id}', ${i}, false)">OFF</button>
                  </div>`;
        }
        return h + `</div></div>`;
    }

    function createPort(parent, node, relX, relY, name) {
        const p = document.createElement('div'); p.className = 'port'; p.style.left = relX + 'px'; p.style.top = relY + 'px';
        p.onclick = (e) => { e.stopPropagation(); onPortClick(node.id, name, relX, relY); };
        parent.appendChild(p);
    }

    function onPortClick(id, portName, relX, relY) {
        const node = data.nodes.find(n => n.id === id);
        const absPos = { x: node.x + relX, y: node.y + relY };
        if (!selectedPort) { selectedPort = { id, portName, relX, relY, absPos }; ghostPath.style.display = 'block'; }
        else {
            if (selectedPort.id !== id) {
                data.wires.push({ from: selectedPort.id, fromPort: selectedPort.portName, fRel: {x:selectedPort.relX, y:selectedPort.relY}, to: id, toPort: portName, tRel: {x:relX, y:relY}, midY: (selectedPort.absPos.y + absPos.y)/2 + 20, label: "" });
                pushHistory();
            }
            selectedPort = null; ghostPath.style.display = 'none'; render();
        }
    }

    function onBusClick(id, e) {
        const node = data.nodes.find(n => n.id === id);
        const relX = e.clientX - e.currentTarget.getBoundingClientRect().left;
        if (!selectedPort) { selectedPort = { id, portName: 'bus', relX, relY: 44, absPos: {x:node.x+relX, y:node.y+44} }; ghostPath.style.display = 'block'; }
        else { data.wires.push({ from: selectedPort.id, fromPort: selectedPort.portName, fRel: {x:selectedPort.relX, y:selectedPort.relY}, to: id, toPort: 'bus', tRel: {x:relX, y:44}, midY: (selectedPort.absPos.y + node.y + 44)/2 + 10 }); pushHistory(); selectedPort = null; ghostPath.style.display = 'none'; render(); }
    }

    function renderWires() {
        let svg = '';
        Array.from(canvas.querySelectorAll('.wire-label-input')).forEach(el => el.remove());
        data.wires.forEach((w, i) => {
            const n1 = data.nodes.find(n => n.id === w.from), n2 = data.nodes.find(n => n.id === w.to);
            if (!n1 || !n2) return;
            const p = (n1.powered && isPortActive(n1, w.fromPort)) || (n2.powered && isPortActive(n2, w.toPort));
            const x1 = n1.x + w.fRel.x, y1 = n1.y + w.fRel.y, x2 = n2.x + w.tRel.x, y2 = n2.y + w.tRel.y;
            svg += `<path d="M ${x1} ${y1} V ${w.midY} H ${x2} V ${y2}" class="wire ${p?'powered':''}" onmousedown="draggingWire=${i}" onclick="if(event.ctrlKey) deleteWire(${i})"/>`;
            const lbl = document.createElement('input'); lbl.className = 'wire-label-input'; lbl.value = w.label || ""; lbl.style.left = (x1+x2)/2+'px'; lbl.style.top = w.midY+'px';
            lbl.onchange = (e) => { w.label = e.target.value; pushHistory(); }; canvas.appendChild(lbl);
        });
        connLayer.innerHTML = `<path id="ghost-path" style="stroke:#fff;stroke-width:2;stroke-dasharray:5;fill:none;display:${selectedPort?'block':'none'}" d="${ghostPath.getAttribute('d')}"></path>` + svg;
    }

    canvas.onmousemove = (e) => {
        const r = canvas.getBoundingClientRect(); const mx = e.clientX - r.left + ws.scrollLeft, my = e.clientY - r.top + ws.scrollTop;
        if (selectedPort) ghostPath.setAttribute('d', `M ${selectedPort.absPos.x} ${selectedPort.absPos.y} V ${my} H ${mx} V ${my}`);
        if (draggingWire !== null) { data.wires[draggingWire].midY = my; renderWires(); }
    };
    canvas.onmouseup = () => { if(draggingWire!==null){ draggingWire=null; pushHistory(); } };

    function controlMC(id, v) { if (prompt("Mật khẩu:") === PASS) { data.nodes.find(n=>n.id===id).state = v; pushHistory(); render(); } }
    function controlRMU(id, b, v) { if (prompt("Mật khẩu:") === PASS) { data.nodes.find(n=>n.id===id).states[b] = v; pushHistory(); render(); } }
    function deleteNode(id) { if(confirm("Xóa?")) { data.nodes = data.nodes.filter(n=>n.id!==id); data.wires=data.wires.filter(w=>w.from!==id&&w.to!==id); pushHistory(); render(); } }
    function deleteWire(i) { data.wires.splice(i,1); pushHistory(); render(); }
    function updateLabel(id, v) { data.nodes.find(n=>n.id===id).label = v; pushHistory(); }
    function clearCanvas() { if(confirm("Xóa sạch?")) { data={nodes:[], wires:[]}; pushHistory(); render(); } }
    function deselectAll() { selectedPort=null; ghostPath.style.display='none'; }
    function startResizeBus(e, id) { e.stopPropagation(); const n = data.nodes.find(n=>n.id===id); let sx=e.clientX, sw=n.width; document.onmousemove=(ev)=>{n.width=Math.max(50, sw+(ev.clientX-sx)); render();}; document.onmouseup=()=>{document.onmousemove=null; pushHistory();}; }
    function startResizeText(e, id) {
        e.stopPropagation(); const n = data.nodes.find(n=>n.id===id);
        let sx=e.clientX, sy=e.clientY, sw=n.width, sh=n.height;
        document.onmousemove=(ev)=>{
            n.width=Math.max(50, sw+(ev.clientX-sx));
            n.height=Math.max(30, sh+(ev.clientY-sy));
            render();
        };
        document.onmouseup=()=>{document.onmousemove=null; pushHistory();};
    }
    function makeDraggable(el, node) {
        let ox, oy; el.onmousedown=(e)=>{
            if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.classList.contains('port')||e.target.classList.contains('btn-s')||e.target.classList.contains('resize-handle')) return;
            ox=e.clientX; oy=e.clientY; document.onmousemove=(ev)=>{
                node.x+=ev.clientX-ox; node.y+=ev.clientY-oy; ox=ev.clientX; oy=ev.clientY;
                el.style.left=node.x+'px'; el.style.top=node.y+'px'; renderWires();
            }; document.onmouseup=()=>{document.onmousemove=null; pushHistory();};
        };
    }

    pushHistory(); render();
</script>
</body>
</html>
